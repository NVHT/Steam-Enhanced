</div><script>
// The header's 8 s loop, driven per frame by dev/brand-art.js (window.__frame): the game's gold progress
// bar fills, the Legendary toast slides in, your reply pops into the Friends chat, the Library
// selection steps down the list, and the windows float (the front one 6 px,
// the Store and Friends windows 4 px the other way); at the end the toast, reply and bar fade so
// the loop restarts cleanly.
addEventListener('DOMContentLoaded', () => {
  const all = [...document.querySelectorAll('div, span, i, b')];
  const styled = (...bits) => all.find((el) => { const st = el.getAttribute('style') || ''; return bits.every((b) => st.includes(b)); });
  const win = document.getElementById('win');
  const toast = document.getElementById('toast');
  // The fanned Store and Friends windows: the rotated boxes before the front window's layer
  const sides = [...win.parentElement.children].filter((el) => el !== win && el.tagName === 'DIV' && /rotate\(-?18deg\)/.test(el.getAttribute('style') || ''));
  const gold = styled('width: 110px', '#f0c060');
  const reply = styled('border-radius: 16px 16px 4px 16px');
  reply.style.transformOrigin = '100% 100%';
  // The selection: Steam's row 0 highlight becomes one bar that slides between rows
  const list = styled('width: 170px', 'flex-direction: column');
  const rows = [...list.children].slice(0, 4);
  const sel = rows[0].style.background;
  rows[0].style.background = 'none';
  list.style.position = 'relative';
  rows.forEach((r) => { r.style.position = 'relative'; });
  const icons = rows.map((r) => r.querySelector('b'));
  const accent = icons[0].style.background, dim = icons[1].style.background;
  const bar = document.createElement('div');
  bar.style.cssText = `position:absolute;left:8px;right:8px;top:14px;height:28px;border-radius:8px;background:${sel}`;
  list.prepend(bar);
  const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
  const span = (t, a, b) => ease((t - a) / (b - a));
  window.__frame = (t) => {
    // Float: one rise and settle per loop, the side windows the other way
    const wave = (1 - Math.cos((t / 8) * 2 * Math.PI)) / 2;
    win.style.translate = `0 ${(-6 * wave).toFixed(3)}px`;
    sides.forEach((el) => { el.style.translate = `0 ${(-4 * (1 - wave)).toFixed(3)}px`; });
    // Progress bar: fills from a quarter to full, fades out at the end and back in at the start
    const fill = 0.25 + 0.75 * span(t, 0.3, 3.6);
    gold.style.clipPath = `inset(0 ${((1 - fill) * 100).toFixed(2)}% 0 0 round 3px)`;
    gold.style.opacity = String(Math.min(span(t, 0, 0.3), 1 - span(t, 7.3, 7.9)));
    // Toast
    const tin = span(t, 3.7, 4.2), tout = span(t, 6.8, 7.3);
    toast.style.opacity = String(tin * (1 - tout));
    toast.style.transform = `translateY(${(10 * (1 - tin) + 6 * tout).toFixed(2)}px)`;
    // Reply in the Friends chat
    const rin = span(t, 4.6, 5.0), rout = span(t, 7.3, 7.8);
    reply.style.opacity = String(rin * (1 - rout));
    reply.style.transform = `scale(${(0.92 + 0.08 * rin).toFixed(3)})`;
    // Selection: a row every 2 s, sliding 0.3 s
    const k = Math.floor(t / 2) % 4, from = (k + 3) % 4, f = span(t - Math.floor(t / 2) * 2, 0, 0.3);
    bar.style.transform = `translateY(${((from + (k - from) * f) * 40).toFixed(2)}px)`;
    icons.forEach((ic, i) => { ic.style.background = i === (f > 0.5 ? k : from) ? accent : dim; });
  };
});
</script></body></html>
