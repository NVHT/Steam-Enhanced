  <circle cx="256" cy="256" r="156" stroke="url(#innerRimGrad)" stroke-width="7"/>
  <circle cx="256" cy="256" r="160.5" stroke="#7cc4ff" stroke-opacity="0.22" stroke-width="1.5"/>
