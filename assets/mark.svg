    </radialGradient>
    <linearGradient id="medallionGrad" x1="140" y1="110" x2="372" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f242b"/>
      <stop offset="50%" stop-color="#1d2128"/>
      <stop offset="100%" stop-color="#171a20"/>
    </linearGradient>
    <linearGradient id="innerRimGrad" x1="120" y1="100" x2="390" y2="412" gradientUnits="userSpaceOnUse">
