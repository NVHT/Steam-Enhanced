      <stop offset="45%" stop-color="#7cc4ff" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#3a506b" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="cardBackFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cc4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#24384b" stop-opacity="0.40"/>
